name: Instagram Poster API CI/CD & Interactive Tester

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      product_url:
        description: 'Product URL (Shopee, Amazon, Shopify, eBay, etc.)'
        required: false
        default: 'https://shopee.ph/Phw-RQZN-3-In-1-Magnetic-Folding-Stand-For-Phones-Laptops-Tablets-zwp-i.1856006428.55266326584'
      image_url:
        description: 'Direct Product Photo Image URL (Optional - leave empty for auto-search)'
        required: false
        default: ''
      theme:
        description: 'Visual Theme (dark_cyan, emerald, purple, minimal_white)'
        required: false
        default: 'dark_cyan'
      brand_name:
        description: 'Brand Handle / Watermark'
        required: false
        default: '@TechGearDaily'
      affiliate_id:
        description: 'Affiliate ID / Referral Tag (Optional)'
        required: false
        default: 'techspecdiges-20'

jobs:
  test_and_generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Test Suite
      env:
        DISABLE_LLM: 'true'
      run: |
        python test_api.py

    - name: Generate Custom Instagram Carousel Post
      env:
        LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        INPUT_PRODUCT_URL: ${{ github.event.inputs.product_url }}
        INPUT_IMAGE_URL: ${{ github.event.inputs.image_url }}
        INPUT_THEME: ${{ github.event.inputs.theme }}
        INPUT_BRAND_NAME: ${{ github.event.inputs.brand_name }}
        INPUT_AFFILIATE_ID: ${{ github.event.inputs.affiliate_id }}
      run: |
        python generate_github_carousel.py

    - name: Upload Carousel Slide PNGs as GitHub Artifact
      uses: actions/upload-artifact@v4
      with:
        name: instagram-carousel-slides
        path: generated_slides/*.png
